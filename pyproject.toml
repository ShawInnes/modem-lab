[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modem-lab"
version = "0.1.0"
description = "Sample-driven Bell 103 modem laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
modem-lab = "modem_lab.demo:main"
modem-lab-web = "modem_lab.api:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
